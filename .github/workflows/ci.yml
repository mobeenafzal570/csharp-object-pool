name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Compile the portable library
        run: dotnet build src/ObjectPool/ObjectPool.csproj --configuration Release
      - name: Run behavioral regression checks
        run: dotnet run --project tests/ObjectPool.Tests/ObjectPool.Tests.csproj --configuration Release
